name: SDDMini - Deploy Conversation Roleplay to Feet
on:
  push:
    tags: ['SDDMini-KF/v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: sddmini-feet-conversation-roleplay
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'SeKondBrainAILabs/conversation-roleplay' && github.event.created && !github.event.deleted
    runs-on:
      [self-hosted, macOS, ARM64, kora-feet, conversation-roleplay-sddmini]
    environment: SDDMini
    timeout-minutes: 30
    steps:
      - name: Deploy the verified release image
        run: node "$HOME/.local/share/conversation-roleplay/sddmini/run-release.mjs"
