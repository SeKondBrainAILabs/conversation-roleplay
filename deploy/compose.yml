name: conversation-roleplay
services:
  lab:
    image: ${ROLEPLAY_IMAGE:-conversation-roleplay:local}
    pull_policy: never
    container_name: ${ROLEPLAY_CONTAINER_NAME:-conversation-roleplay}
    restart: unless-stopped
    init: true
    environment:
      ROLEPLAY_CONFIG: /config/config.json
      ROLEPLAY_RUNS_DIR: /data/runs
      ROLEPLAY_START_DRAINED: "true"
      ROLEPLAY_PUBLIC_PORT: ${ROLEPLAY_PORT:-4318}
    env_file:
      - ${ROLEPLAY_ENV_FILE:?Set ROLEPLAY_ENV_FILE to a private service credential file}
    ports:
      - "${ROLEPLAY_BIND_ADDRESS:-127.0.0.1}:${ROLEPLAY_PORT:-4318}:4318"
    volumes:
      - runs:/data/runs
      - type: bind
        source: ${ROLEPLAY_CONFIG_FILE:?Set ROLEPLAY_CONFIG_FILE to server configuration}
        target: /config/config.json
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    labels:
      ai.sekondbrain.roleplay.managed: "true"
volumes:
  runs:
